# Production static site — frontend only (backend/ is local dev, not deployed).
staticSites:
  - name: amrita-books-demo
    rootDir: frontend
    buildCommand: npm install --include=dev --registry https://registry.npmjs.org/ && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
